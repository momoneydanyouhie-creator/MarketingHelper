<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TitlePen: newsletters and marketing for title companies</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
:root{--ink:#14233B;--bond:#EEF2F0;--paper:#fff;--line:#C9D3CF;--seal:#0E6B63;--muted:#53627a;--err:#a32d2d}
*{box-sizing:border-box}
body{margin:0;background:var(--bond);color:var(--ink);font:16px/1.6 "IBM Plex Sans",sans-serif}
h1,h2,h3{font-family:Newsreader,Georgia,serif;line-height:1.15;margin:0 0 .5em}
h1{font-size:clamp(2rem,5vw,3.4rem);max-width:18ch}
a{color:var(--seal)}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
nav{border-bottom:2px solid var(--ink);background:var(--paper)}
nav .wrap{display:flex;gap:20px;align-items:center;min-height:56px;flex-wrap:wrap}
nav .brand{font:600 1.35rem Newsreader,serif;color:var(--ink);text-decoration:none;margin-right:auto}
nav a{color:var(--ink);text-decoration:none;font-weight:500}
nav a:hover{color:var(--seal)}
.btn{display:inline-block;background:var(--ink);color:#fff;border:0;border-radius:4px;padding:10px 18px;font:500 1rem "IBM Plex Sans",sans-serif;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--seal)}.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--seal);outline-offset:2px}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:4px;font:inherit;background:var(--paper);color:var(--ink)}
label{display:block;font-weight:500;margin:12px 0 4px}
.sheet{background:var(--paper);border:1.5px solid var(--line);border-radius:4px;padding:22px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin:24px 0}
.plan .price{font:600 2rem Newsreader,serif}
.err{color:var(--err);font-weight:500}.muted{color:var(--muted)}
.doc{background:var(--paper);border:1.5px solid var(--line);border-left:5px solid var(--seal);padding:20px 24px;min-height:120px}
.doc h2{font-size:1.5rem}.doc h3{font-size:1.15rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
@media(max-width:640px){nav .wrap{gap:12px}}
</style></head><body>
<nav><div class="wrap"><a class="brand" href="/">TitlePen</a>
<a href="/templates">Templates</a>
{% if user %}<a href="/generate">Generator</a>
{% if user.customer %}<form method="post" action="/portal" style="margin:0"><button class="btn alt" type="submit">Manage billing</button></form>{% endif %}
<a href="/logout">Log out</a>{% endif %}</div></nav>
<main class="wrap" style="padding-top:36px;padding-bottom:60px">{% block body %}{% endblock %}</main>
</body></html>
