databases:
  - name: titlepen-db
    plan: free
services:
  - type: web
    name: titlepen
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: titlepen-db, property: connectionString}
      - key: SECRET_KEY
        generateValue: true
      - {key: BASE_URL, sync: false}
      - {key: ANTHROPIC_API_KEY, sync: false}
      - {key: STRIPE_SECRET_KEY, sync: false}
      - {key: STRIPE_WEBHOOK_SECRET, sync: false}
      - {key: STRIPE_PRICE_STARTER, sync: false}
      - {key: STRIPE_PRICE_PRO, sync: false}
      - {key: STRIPE_PRICE_UNLIMITED, sync: false}
